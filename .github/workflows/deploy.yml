name: ElAmal
on:
 push:
  branches:
   - feature
 
jobs: 
 build:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v2
   - run: docker login -u ${{secrets.DOCKER_USERNAME}} -p ${{secrets.DOCKER_PASSWORD}}
  
   - run: docker build -t shahdfares/elamal-website-backend -f ../ElAmal/Dockerfile .
   - run: docker build -t shahdfares/elamal-dashboard-backend -f ../Dashboard/Dockerfile .
  
   - run: docker push shahdfares/elamal-website-backend 
   - run: docker push shahdfares/elamal-dashboard-backend  