name: ElAmal

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  ACR_NAME: elamalfurnitureacr
  ACR_LOGIN_SERVER: elamalfurnitureacr.azurecr.io

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Azure Variables
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          if [ -z "$AZURE_CLIENT_ID" ]; then
            echo "AZURE_CLIENT_ID is missing"
            exit 1
          fi

          if [ -z "$AZURE_TENANT_ID" ]; then
            echo "AZURE_TENANT_ID is missing"
            exit 1
          fi

          if [ -z "$AZURE_SUBSCRIPTION_ID" ]; then
            echo "AZURE_SUBSCRIPTION_ID is missing"
            exit 1
          fi

          echo "All Azure variables are available"

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build Website Backend
        run: |
          docker build \
            -f ElAmal/ElAmal/Dockerfile \
            -t ${{ env.ACR_LOGIN_SERVER }}/website-backend:latest \
            -t ${{ env.ACR_LOGIN_SERVER }}/website-backend:${{ github.sha }} \
            ./ElAmal

      - name: Build Dashboard Backend
        run: |
          docker build \
            -f ElAmal/Dashboard/Dockerfile \
            -t ${{ env.ACR_LOGIN_SERVER }}/dashboard-backend:latest \
            -t ${{ env.ACR_LOGIN_SERVER }}/dashboard-backend:${{ github.sha }} \
            ./ElAmal

      - name: Push Website Backend
        run: |
          docker push ${{ env.ACR_LOGIN_SERVER }}/website-backend:latest
          docker push ${{ env.ACR_LOGIN_SERVER }}/website-backend:${{ github.sha }}

      - name: Push Dashboard Backend
        run: |
          docker push ${{ env.ACR_LOGIN_SERVER }}/dashboard-backend:latest
          docker push ${{ env.ACR_LOGIN_SERVER }}/dashboard-backend:${{ github.sha }}
